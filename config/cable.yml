development:
  adapter: redis
  host: <%= ENV["lando_redis_conn_host"] || "localhost" %>
  port: <%= ENV["lando_redis_conn_port"] || 6379 %>
  db: 0

test:
  adapter: async

production: &production
  adapter: redis
  name: 'redis-production'
  password: <%= ENV['FIGGY_REDIS_PASSWORD'] %>
  sentinel_password: <%= ENV['FIGGY_REDIS_PASSWORD'] %>
  db: <%= ENV['FIGGY_REDIS_DB'] || 0 %>
  sentinels:
    - host: "nomad-client-prod1.lib.princeton.edu"
      port: 26379
    - host: "nomad-client-prod5.lib.princeton.edu"
      port: 26379
    - host: "nomad-client-prod3.lib.princeton.edu"
      port: 26379

staging:
  adapter: redis
  name: 'redis-staging'
  password: <%= ENV['FIGGY_REDIS_PASSWORD'] %>
  sentinel_password: <%= ENV['FIGGY_REDIS_PASSWORD'] %>
  db: <%= ENV['FIGGY_REDIS_DB'] || 0 %>
  sentinels:
    - host: "nomad-client-staging4.lib.princeton.edu"
      port: 26379
    - host: "dpul-collections-staging1.lib.princeton.edu"
      port: 26379
    - host: "dpul-collections-staging2.lib.princeton.edu"
      port: 26379
