name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/pulibrary/figgy
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
        env:
          DOCKER_METADATA_PR_HEAD_SHA: true
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: sidekiq_pro=${{ secrets.BUNDLE_GEMS__CONTRIBSYS__COM }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ci
          push: true
          tags: ghcr.io/pulibrary/figgy:ci-${{ github.sha }}
          secrets: sidekiq_pro=${{ secrets.BUNDLE_GEMS__CONTRIBSYS__COM }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  lint:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: read
    container:
      image: ghcr.io/pulibrary/figgy:ci-${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: /rails
    steps:
      - run: bundle exec rake rubocop
      - run: yarn lint
      - run: yarn test
      - run: cd cloud_fixity && yarn test

  test:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: read
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, flaky]
    container:
      image: ghcr.io/pulibrary/figgy:ci-${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      env:
        FIGGY_DB_HOST: postgres
        FIGGY_DB_USERNAME: figgy
        lando_redis_conn_host: redis
        lando_figgy_test_solr_conn_host: solr
    services:
      postgres:
        image: cimg/postgres:15.2
        env:
          POSTGRES_USER: figgy
          POSTGRES_DB: figgy_test
          POSTGRES_HOST_AUTH_METHOD: trust
      solr:
        image: quay.io/pulibrary/ci-solr:9.9-v1.0.0
        env:
          SOLR_MODE: solrcloud
          SOLR_PORT: "8984"
      redis:
        image: redis:8
    defaults:
      run:
        working-directory: /rails
    steps:
      - name: Set up services
        run: |
          timeout 60 bash -c 'until pg_isready -h postgres; do sleep 1; done'
          timeout 120 bash -c 'until curl -sf -o /dev/null http://solr:8984/solr/admin/info/system; do sleep 1; done'
          (cd solr/config && zip -q -1 -r /tmp/solr_config.zip ./*)
          curl -sf -H "Content-type:application/octet-stream" --data-binary @/tmp/solr_config.zip "http://solr:8984/solr/admin/configs?action=UPLOAD&name=figgy"
          curl -sf -H "Content-type: application/json" http://solr:8984/api/collections/ -d '{"name": "figgy-core-test", "config": "figgy", "numShards": 1}'
          bin/rails db:migrate
      - name: Run rspec
        run: |
          if [ "${{ matrix.group }}" = flaky ]; then
            bundle exec rspec --tag flaky
          else
            mapfile -t specs < <(find spec -name '*_spec.rb' | sort | awk 'NR % 4 == ${{ matrix.group }} - 1')
            bundle exec rspec --tag "~flaky" "${specs[@]}"
          fi
      - run: mkdir coverage_results && cp coverage/.resultset.json coverage_results/.resultset-${{ matrix.group }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.group }}
          path: /rails/coverage_results
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: capybara-${{ matrix.group }}
          path: /rails/tmp/capybara
          if-no-files-found: ignore

  coverage:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      packages: read
    container:
      image: ghcr.io/pulibrary/figgy:ci-${{ github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: /rails
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: /rails/coverage_results
          merge-multiple: true
      - run: bundle exec ruby scripts/combine_coverage.rb
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: /rails/coverage
